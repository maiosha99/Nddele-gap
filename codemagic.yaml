workflows:
  generate-android-keystore:
    name: Generate Android Keystore
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Generate upload keystore
        script: |
          mkdir -p codemagic-keystore
          STORE_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')
          KEY_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=needlegap
          keytool -genkeypair \
            -v \
            -keystore codemagic-keystore/needlegap-upload-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Needle Gap, OU=Games, O=Needle Gap, L=Cairo, ST=Cairo, C=EG"
          {
            echo "Reference name: needle_gap_upload_key"
            echo "Alias: $KEY_ALIAS"
            echo "Keystore password: $STORE_PASSWORD"
            echo "Key password: $KEY_PASSWORD"
          } > codemagic-keystore/keystore-info.txt
    artifacts:
      - codemagic-keystore/*

  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.finan.needlegap"
    scripts:
      - name: Show project files
        script: |
          pwd
          ls -la
          ls -la app
      - name: Create Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.9 --distribution-type all --no-configuration-cache
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release-aab:
    name: Android Release AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      android_signing:
        - needle_gap_upload_key
      vars:
        PACKAGE_NAME: "com.finan.needlegap"
    scripts:
      - name: Create Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.9 --distribution-type all --no-configuration-cache
      - name: Build release app bundle
        script: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --stacktrace -PversionCode=$BUILD_NUMBER -PversionName=1.0.$BUILD_NUMBER
    artifacts:
      - app/build/outputs/bundle/release/*.aab
